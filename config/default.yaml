  warmup_s: 4.0
  preferred_maps: [Town03, Town04, Town05, Town01, Town02]
  mode: shield

traffic:
  npc_vehicles_min: 10
  npc_vehicles_max: 18
  pedestrians_min: 4
  pedestrians_max: 10
  tm_port: 8000
  global_distance_m: 2.5
  hybrid_physics: true
  hybrid_radius_m: 60.0

scenario:
  lead_spawn_distance_m: [30.0, 42.0]
  hazard_events: 2
  hazard_first_window_s: [28.0, 42.0]
  hazard_second_window_s: [70.0, 92.0]
  hazard_brake_duration_s: [3.5, 6.0]
  hazard_brake_intensity: [0.75, 1.0]
  weather_choices: [ClearNoon, CloudyNoon, WetNoon, SoftRainSunset, ClearSunset]

safety:
  enabled: true
  monitor_range_m: 55.0
  corridor_half_width_m: 2.4
