  warning_ttc_s: 2.5
  critical_ttc_s: 1.2
  warning_clearance_m: 1.2
  critical_clearance_m: 0.15
  warning_brake: 0.55
  critical_brake: 1.0
  hold_s: 0.7

controller:
  lookahead_m: 6.0
  waypoint_step_m: 3.0
  steer_kp: 1.15
  steer_kd: 0.12
  speed_kp: 0.35
  speed_ki: 0.04
  speed_kd: 0.05
  max_throttle: 0.65
  max_brake: 0.85

camera:
  width: 960
  height: 540
  fov: 90
  fps: 10
  x: -6.5
  z: 3.2
  pitch: -12.0

server:
  host: 127.0.0.1
  port: 2000
  timeout_s: 75.0
  quality: Low
  offscreen: true
  no_sound: true

recording:
  prefer_nvenc: true
  crf: 27
  fps: 10

storage:
  min_free_before_run_gb: 4.0
  output_root: outputs
